<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telmy.ai — Microphone Permission</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --success: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text-main);
      padding: 24px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.07), 0 0 1px 1px rgba(0, 0, 0, 0.05);
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #eff6ff;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      position: relative;
    }
    .icon-wrap.success {
      background: #ecfdf5;
      color: var(--success);
    }
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--primary);
      animation: pulse 1.8s infinite;
      opacity: 0.6;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-main);
    }
    p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-allow {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 13px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-allow:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }
    .alert-box {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      text-align: left;
      display: none;
    }
    .alert-box.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fee2e2;
      display: block;
    }
    .alert-box.success {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #d1fae5;
      display: block;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap" id="icon-wrap">
      <div class="pulse-ring" id="pulse-ring"></div>
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" x2="12" y1="19" y2="22"/>
      </svg>
    </div>

    <h1 id="title-text">Microphone Permission</h1>
    <p id="desc-text">Telmy needs microphone access to enable Voicebot Mode and allow you to speak directly with your AI Form Assistant.</p>

    <button id="btn-request" class="btn-allow">
      <span>Allow Microphone Access</span>
    </button>

    <div id="status-box" class="alert-box"></div>
  </div>

  <script src="request-mic.js"></script>
</body>
</html>
