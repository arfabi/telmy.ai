<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMT — GuideMe.To</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="gmt-popup">
    <!-- Header -->
    <header class="gmt-header">
      <div class="gmt-brand">
        <img src="../assets/icons/icon32.png" alt="GMT Logo" class="gmt-logo">
        <div>
          <h1 class="gmt-title">GuideMe.To</h1>
          <span class="gmt-tagline">AI Form Explainer</span>
        </div>
      </div>
      <div class="gmt-toggle-wrapper">
        <label class="switch" title="Aktifkan / Nonaktifkan GMT">
          <input type="checkbox" id="gmt-active-toggle" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </header>

    <!-- Main Content -->
    <main class="gmt-body">
      <!-- Status Box -->
      <div class="gmt-status-card" id="gmt-status-box">
        <div class="gmt-status-dot pulse"></div>
        <div class="gmt-status-info">
          <span class="gmt-status-text" id="gmt-status-label">GMT Aktif & Siap Memandu</span>
          <span class="gmt-status-sub" id="gmt-detected-count">Memindai formulir...</span>
        </div>
      </div>

      <!-- Language Selector -->
      <div class="gmt-section">
        <label class="gmt-section-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20M2 12h20"/></svg>
          Bahasa Penjelasan (Language)
        </label>
        <div class="gmt-lang-grid" id="gmt-lang-selector">
          <button class="gmt-lang-btn active" data-lang="id">
            <span class="flag">🇮🇩</span>
            <span class="lang-name">Indonesia</span>
          </button>
          <button class="gmt-lang-btn" data-lang="en">
            <span class="flag">🇬🇧</span>
            <span class="lang-name">English</span>
          </button>
          <button class="gmt-lang-btn" data-lang="zh">
            <span class="flag">🇨🇳</span>
            <span class="lang-name">中文</span>
          </button>
          <button class="gmt-lang-btn" data-lang="ja">
            <span class="flag">🇯🇵</span>
            <span class="lang-name">日本語</span>
          </button>
          <button class="gmt-lang-btn" data-lang="ko">
            <span class="flag">🇰🇷</span>
            <span class="lang-name">한국어</span>
          </button>
        </div>
      </div>

      <!-- Quick Stats & History Section -->
      <div class="gmt-section">
        <label class="gmt-section-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
          Ringkasan Saya
        </label>
        <div class="gmt-stats-grid">
          <div class="gmt-stat-box">
            <span class="gmt-stat-num" id="stat-fields-count">0</span>
            <span class="gmt-stat-desc">Field Dipandu</span>
          </div>
          <div class="gmt-stat-box">
            <span class="gmt-stat-num" id="stat-suggestions-count">0</span>
            <span class="gmt-stat-desc">Saran Dikirim</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="gmt-actions">
        <button class="gmt-btn-primary" id="btn-rescan">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
          Pindai Ulang Form
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="gmt-footer">
      <span>GuideMe.To v1.0 • Phase 1 Local Mock</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
