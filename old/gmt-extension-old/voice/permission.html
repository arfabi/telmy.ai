<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Izin Mikrofon GMT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background: #F5F5F7;
      color: #1D1D1F;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
      border-radius: 24px;
      padding: 44px 36px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
    .icon {
      font-size: 56px;
      margin-bottom: 20px;
      display: inline-block;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #1D1D1F;
      letter-spacing: -0.3px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #515154;
      margin-bottom: 28px;
    }
    .btn {
      background: #0071E3;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 15.5px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.3);
    }
    .btn:hover {
      background: #0077ED;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 113, 227, 0.4);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .status {
      font-size: 14px;
      margin-top: 16px;
      color: #248A3D;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎙️</div>
    <h1>Izin Mikrofon Global GMT</h1>
    <p>
      Klik tombol di bawah dan pilih <b>"Allow" (Izinkan)</b> di dialog browser agar fitur suara dan perintah <b>"Halo GMT"</b> dapat bekerja di <b>seluruh website</b> secara bebas tanpa terputus.
    </p>
    <button class="btn" id="request-btn">Izinkan Mikrofon Sekarang</button>
    <div class="status" id="status" style="display:none;"></div>
  </div>

  <script>
    const btn = document.getElementById('request-btn');
    const status = document.getElementById('status');

    btn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());
        btn.style.display = 'none';
        status.style.display = 'block';
        status.textContent = '✅ Izin berhasil diberikan! Menutup tab ini...';
        chrome.storage.local.set({ gmt_mic_permission_granted: true }, () => {
          setTimeout(() => {
            window.close();
          }, 800);
        });
      } catch (err) {
        status.style.display = 'block';
        status.style.color = '#FF3B30';
        status.textContent = '❌ Akses mikrofon ditolak atau dibatalkan: ' + err.message;
      }
    });

    // Check if already granted
    navigator.permissions.query({ name: 'microphone' }).then(res => {
      if (res.state === 'granted') {
        chrome.storage.local.set({ gmt_mic_permission_granted: true });
        status.style.display = 'block';
        status.textContent = '✅ Izin sudah aktif! Menutup...';
        setTimeout(() => window.close(), 600);
      }
    }).catch(() => {});
  </script>
</body>
</html>
