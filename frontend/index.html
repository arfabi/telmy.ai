    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: Telmy.ai Design System v1.0 (Nunito for UI & Display, DM Mono for Code & Labels) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    <!-- PDF.js for Web Dashboard Studio -->

    <script>
      if (window['pdfjs-dist/build/pdf']) {
        window.pdfjsLib = window['pdfjs-dist/build/pdf'];
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-500 selection:text-white">
